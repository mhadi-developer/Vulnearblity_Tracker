<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vulnerability Tracker - Sign In</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./login-style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<div class="wrap">
  <header class="top glass">
    <div class="brand">
      <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
      Vulnerability Tracker
    </div>
    <span class="chip" id="mode">Demo mode</span>
    <button class="btn sm" id="setBtn" type="button">Settings</button>
  </header>

  <main>
    <section id="auth" class="glass">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to log and manage security findings.</p>
      <div class="tabs clay" role="tablist">
        <button role="tab" id="tin" aria-selected="true" type="button">Sign in</button>
        <button role="tab" id="tup" aria-selected="false" type="button">Register</button>
      </div>
      <form id="af">
        <div class="field"><label for="em">Email</label><input id="em" type="email" value="analyst@example.com" required autocomplete="email"></div>
        <div class="field"><label for="pw">Password</label><input id="pw" type="password" value="demo-password" required autocomplete="current-password"></div>
        <div class="field" id="rlBox"><label for="rl">Sign in as (demo only)</label><select id="rl"><option value="analyst">Analyst</option><option value="admin">Admin</option></select></div>
        <button class="btn pri" id="go" type="submit" style="width:100%">Sign in</button>
      </form>
    </section>
  </main>
</div>

<dialog id="sDlg"><form class="glass" id="sf" method="dialog">
  <h2>Settings</h2>
  <div class="field"><label for="api">API base URL</label><input id="api" type="url" placeholder="http://localhost:8000"></div>
  <p class="hint">Leave empty for demo mode, which stores sample data in this browser. With a URL, the app calls POST /auth/login, GET /users, and /findings.</p>
  <div class="end"><button class="btn" id="sx" type="button">Cancel</button><button class="btn pri" type="submit">Save settings</button></div>
</form></dialog>

<div id="toasts" aria-live="polite"></div>

<script>
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let S={base:ls.get('vt.api')||'',tab:'in'};
const demo=()=>!S.base;
const $=id=>document.getElementById(id);

function toast(msg,err){
  const t=document.createElement('div');t.className='toast glass'+(err?' err':'');t.textContent=msg;
  t.setAttribute('role',err?'alert':'status');$('toasts').append(t);
  setTimeout(()=>t.remove(),3800);
}

function tab(t){
  S.tab=t;$('tin').setAttribute('aria-selected',t==='in');$('tup').setAttribute('aria-selected',t==='up');
  $('go').textContent=t==='in'?'Sign in':'Create account';$('rlBox').hidden=!demo()||t==='up';
}

$('tin').onclick=()=>tab('in');
$('tup').onclick=()=>tab('up');

$('af').onsubmit=async e=>{
  e.preventDefault();
  const email=$('em').value.trim(), pw=$('pw').value;
  if(pw.length<6){toast('Password must be at least 6 characters', true);return;}
  
  if(demo()){
    ls.set('vt.auth', JSON.stringify({email, role: S.tab==='up'?'analyst':$('rl').value}));
    window.location.href = 'home.html';
  } else {
    try {
      const body = S.tab==='up' ? JSON.stringify({email, password:pw}) : new URLSearchParams({username:email, password:pw});
      const endpoint = S.tab==='up' ? '/auth/register' : '/auth/login';
      const r = await fetch(S.base.replace(/\/$/,'')+endpoint, {
        method:'POST',
        headers: S.tab==='up'?{'Content-Type':'application/json'}:{},
        body
      });
      if(!r.ok) throw new Error('Authentication failed');
      const res = await r.json();
      ls.set('vt.token', res.access_token);
      window.location.href = 'home.html';
    } catch(err){
      toast(err.message, true);
    }
  }
};

$('setBtn').onclick=()=>{$('api').value=S.base;$('sDlg').showModal();};
$('sx').onclick=()=>$('sDlg').close();
$('sf').onsubmit=e=>{
  e.preventDefault();
  S.base=$('api').value.trim();
  ls.set('vt.api', S.base);
  $('sDlg').close();
  $('mode').textContent = demo() ? 'Demo mode' : 'API connected';
  toast(demo()?'Demo mode on':'API base updated');
};
$('mode').textContent = demo() ? 'Demo mode' : 'API connected';
</script>
</body>
</html>
